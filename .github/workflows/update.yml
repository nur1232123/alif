# Обновление по воздуху: после изменений в приложении ученики получают их сами при следующем запуске.
# Нужен секрет репозитория EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# Обновление доходит только до сборок с тем же «отпечатком» нативной части (runtimeVersion: fingerprint):
# если добавился нативный модуль, нужна новая сборка APK.
name: Обновление приложения

on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'app.json', 'package.json', 'package-lock.json', 'updates/**']
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Нет EXPO_TOKEN — пропускаем
        if: env.EXPO_TOKEN == ''
        run: echo "Добавьте секрет EXPO_TOKEN в настройках репозитория, чтобы включить обновления по воздуху"
      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.EXPO_TOKEN != ''
        run: npm ci
      - name: Проверки
        if: env.EXPO_TOKEN != ''
        run: npm run check
      - name: Настройки как у APK
        if: env.EXPO_TOKEN != ''
        run: node scripts/env-from-eas.mjs preview
      - name: Отпечаток выложенного APK
        if: env.EXPO_TOKEN != ''
        # Обновление помечается отпечатком APK из updates/runtime-preview.txt, иначе телефоны его не примут.
        # После новой сборки APK впишите туда её отпечаток (файл assets/fingerprint внутри APK)
        run: |
          node -e "const f=require('fs');const a=JSON.parse(f.readFileSync('app.json'));a.expo.runtimeVersion=f.readFileSync('updates/runtime-preview.txt','utf8').trim();f.writeFileSync('app.json',JSON.stringify(a,null,2))"
          grep -n runtimeVersion app.json
      - name: Опубликовать обновление
        if: env.EXPO_TOKEN != ''
        run: |
          test -n "$EXPO_PUBLIC_SERVER_URL" && test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Нет настроек EXPO_PUBLIC_*: обновление не публикуем"; exit 1; }
          npx expo export --platform android --platform ios --output-dir dist
          # Проверка, что настройки попали в сборку: без адреса сервера приложение пишет «Нет связи»
          grep -rqs "alif-server.onrender.com" dist/_expo || { echo "В сборке нет адреса сервера: обновление не публикуем"; exit 1; }
          npx eas-cli@latest update --channel preview --environment preview --skip-bundler --input-dir dist --message "$(git log -1 --pretty=%s)" --non-interactive
